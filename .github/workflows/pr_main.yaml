---

name: pr_main
on:
  pull_request:
    branches:
      - main

jobs:
  pr_main:
    name: "pr_main"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: python setup
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: pr_main
        shell: bash
        run: |
          ./entrypoint pr_main
